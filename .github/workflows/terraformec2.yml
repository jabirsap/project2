name: Automate EC2 with Terraform

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  terraform:
    name: Terraform Automation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Check Terraform Version
      - name: Check Terraform Version
        run: |
          if ! terraform --version &> /dev/null; then
            echo "Terraform is not installed. Please ensure Terraform is installed."
            exit 1
          else
            echo "Terraform version:"
            terraform --version
          fi

      # Step 3: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRETKEY }}
          aws-region: us-east-1

      # Step 4: Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Step 5: Validate Terraform Files
      - name: Terraform Validate
        run: terraform validate

      # Step 6: Plan Terraform Changes
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        if: success()

  manual-apply:
    name: Manual Terraform Apply
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRETKEY }}
          aws-region: us-east-1

      # Step 3: Apply Terraform Changes (Manual Trigger)
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

